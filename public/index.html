<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soy IA Brenda</title>
  <link rel="icon" type="image/x-icon" href="/images/brenda-avatar-32x32.png">

  <!-- Fonts for Auth Overlay -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Nunito+Sans:wght@400&family=Open+Sans:wght@600&family=Roboto:wght@400&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?GAGv22A" />
  <link rel="stylesheet" href="med-styles.css?v=1" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FFFFFF" />
</head>

<body>

  <div class="container">
    <!-- Fixed header inside container -->
    <div class="header">
      <div class="header-left">
        <img src="images/brenda-avatar.png" alt="Brenda" class="avatar" id="brendaAvatar" />
        <div class="header-title-block">
          <div class="header-top">
            <h1>IA Brenda</h1>
            <div class="header-top-buttons">
              <button id="accountBtn" class="account-btn" type="button"></button>
              <button id="myInfoBtn" class="my-info-btn" type="button"></button>
            </div>
            <button id="helpBtn" class="help-btn" type="button" aria-label="Help">?</button>
          </div>
        </div>
        <div class="header-actions">
          <button id="subjectsBtn" class="subjects-btn" type="button"></button>
          <button id="medBtn" class="med-btn" type="button"></button>
          <button id="latestBtn" class="latest-btn" type="button"></button>
          <button id="headlinesBtn" class="headlines-btn" type="button"></button>
          <button id="chatBtn" class="chat-rds-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- Main content area -->
    <div class="main">

      <!-- MODE VISUAL AREA (top) -->
      <section class="mode-visual">

        <!-- TALK visual -->
        <div id="panelTalk" class="panel panel-talk">
          <div class="voice-visualizer">
            <canvas id="waveform"></canvas>
          </div>
        </div>

        <!-- TEXT visual (none for now) -->
        <div id="panelText" class="panel panel-text hidden"></div>

        <!-- VIDEO (future) -->
        <div id="panelVideo" class="panel panel-video hidden"></div>

      </section>

      <!-- SHARED TRANSCRIPT (never changes across modes) -->
      <section class="panel panel-transcript" aria-live="polite">
        <div id="transcript" class="transcript">
          <div class="transcript-inner" id="transcriptInner"></div>
        </div>
      </section>

      <!-- CALL OVERLAY (new) -->
      <div id="callConnecting" class="call-connecting hidden" aria-hidden="true">
        <div class="connecting-pill" role="status" aria-live="polite">
          <span class="connecting-label" id="callConnectingLabel">Connecting</span>
          <span class="connecting-dots" aria-hidden="true">
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
          </span>
        </div>
      </div>
      <div id="callThinking" class="call-connecting hidden" aria-hidden="true">
        <div class="connecting-pill" role="status" aria-live="polite">
          <span class="connecting-label" id="callThinkingLabel">Thinking</span>
          <span class="connecting-dots" aria-hidden="true">
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
          </span>
        </div>
      </div>

      <div id="callOverlay" class="call-overlay hidden" aria-hidden="true">
        <div class="call-card">
          <button id="callMinBtn" class="call-min-btn" type="button" aria-label="Minimise">
            <!-- square + hyphen -->
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M8 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>

          <div class="call-card-body">
            <img class="call-avatar" src="images/brenda-avatar.png" alt="Brenda" />
            <div class="call-title" id="callTitle"></div>
          </div>

          <button id="callHangBtn" class="call-hang-btn" type="button" aria-label="Hang up">
            <div class="call-hang-progress" aria-hidden="true"></div>
            <img src="images/hangup-icon-100x100.png" alt="" class="call-hang-icon" draggable="false" />
          </button>

          <p id="callDisclaimer" class="ai-disclaimer call-disclaimer"></p>

        </div>
      </div>

      <!-- MINIMISED CALL TILE (new) -->
      <div id="callTile" class="call-tile hidden" aria-hidden="true">
        <button id="callExpandBtn" class="call-expand-btn" type="button" aria-label="Expand">
          <!-- hyphen icon (square + short line) -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- MODE INPUT AREA (bottom of main; switches by mode) -->
      <section class="mode-input">

        <p id="aiDisclaimer" class="ai-disclaimer"></p>

        <!-- TEXT input -->
        <div id="textInputWrap" class="text-input-wrap hidden">
          <div class="chat-inputbar">
            <textarea id="chatInput" class="chat-input" rows="1" placeholder="Type a message..."></textarea>
            <button id="chatSendBtn" class="chat-send" type="button">Send</button>
          </div>
        </div>

      </section>

    </div>

    <!-- Bottom controls (Talk/Text buttons) -->
    <div class="activate-buttons-frame">
      <div class="row">

        <!--  <button id="toggleBtnTalk" class="btn-toggle-talk btn-connect-talk" type="button"></button> -->
        <!--  <button id="toggleBtnText" class="btn-toggle-text btn-connect-text" type="button"></button> -->
        <button id="toggleBtnTalk" class="btn-toggle-talk btn-connect-talk" type="button">Talk</button>
        <button id="toggleBtnText" class="btn-toggle-text btn-connect-text" type="button">Text</button>

      </div>

      <div class="row">
        <div class="column">
          <p class="hintTalk" id="hintTalk">Click to Speak</p>
        </div>
        <div class="column">
          <p class="hintText" id="hintText">Click to Text</p>
        </div>
      </div>
    </div>

    <!-- AUTH OVERLAY (Sign in / Sign up) -->
    <div id="authOverlay" class="auth-overlay hidden" aria-hidden="true">
      <div class="auth-card">
        <button id="authCloseBtn" class="popup-close-btn auth-close hidden" type="button" aria-label="Close">×</button>

        <div class="auth-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="auth-avatar" />
          <div class="auth-greeting" id="authGreeting"></div>
          <div class="auth-explain" id="authExplain"></div>
        </div>

        <div class="auth-form">
          <label class="auth-label" for="authNick" id="authNickLabel"></label>
          <input id="authNick" class="auth-input" type="text" inputmode="text" autocomplete="username" />
          <div class="auth-help" id="authNickHelp"></div>

          <label class="auth-label" for="authPin" id="authPinLabel"></label>
          <input id="authPin" class="auth-input" type="password" inputmode="numeric" autocomplete="current-password"
            maxlength="4" />
          <div class="auth-help" id="authPinHelp01"></div>
          <div class="auth-help" id="authPinHelp02"></div>

          <button id="authContinueBtn" class="auth-continue" type="button"></button>

          <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>

          <button id="authAnonBtn" class="auth-anon-link" type="button"></button>

          <a class="auth-privacy" id="authPrivacyLink" href="privacy.html" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>

    <!-- SUBJECTS POPUP -->
    <div id="subjectsOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="subjectsTitle">
        <div class="popup-card-header">
          <h1 id="subjectsTitle"></h1>
          <button id="subjectsCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="subjectsSubtitle" class="popup-subtitle"></h2>

        <form id="subjectsForm" class="popup-form">
          <label class="popup-field">
            <span id="subjectLabel1" class="popup-label"></span>
            <input id="subjectInput1" name="subject1" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel2" class="popup-label"></span>
            <input id="subjectInput2" name="subject2" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel3" class="popup-label"></span>
            <input id="subjectInput3" name="subject3" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel4" class="popup-label"></span>
            <input id="subjectInput4" name="subject4" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel5" class="popup-label"></span>
            <input id="subjectInput5" name="subject5" type="text" maxlength="120" />
          </label>
        </form>

        <div class="popup-actions">
          <button id="subjectsCancelBtn" class="popup-btn-cancel" type="button"></button>
          <button id="subjectsSaveBtn" class="popup-btn-save" type="button"></button>
        </div>
        <div id="subjectsStatus" class="popup-status" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- HELP OVERLAY -->
    <div id="helpOverlay" class="help-overlay hidden" aria-hidden="true">
      <div class="help-card" role="dialog" aria-modal="true">
        <button id="helpCloseBtn" class="help-close-btn" type="button" aria-label="Close">×</button>
        <div id="helpContent" class="help-content" role="document"></div>
        <button id="helpBottomCloseBtn" class="help-bottom-close" type="button"></button>
      </div>
    </div>

    <!-- I AM BRENDA OVERLAY -->
    <div id="brendaOverlay" class="brenda-overlay hidden" aria-hidden="true">
      <div class="brenda-card" role="dialog" aria-modal="true">
        <button id="brendaCloseBtn" class="brenda-close-btn" type="button" aria-label="Close">×</button>
        
        <div class="brenda-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="brenda-avatar" />
          <h1 id="brendaTitle" class="brenda-title"></h1>
          <h2 id="brendaSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div id="brendaContent" class="brenda-content"></div>
        
        <button id="brendaBottomCloseBtn" class="brenda-bottom-close" type="button"></button>
      </div>
    </div>

    <!-- MY INFO OVERLAY -->
    <div id="myInfoOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="myInfoTitle">
        <div class="popup-card-header">
          <h1 id="myInfoTitle"></h1>
          <button id="myInfoCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="myInfoSubtitle" class="popup-subtitle"></h2>

        <form id="myInfoForm" class="popup-form">
          <label class="popup-field">
            <span id="myInfoTownLabel" class="popup-label"></span>
            <input id="myInfoTownInput" name="town" type="text" maxlength="100" autocomplete="address-level2" />
          </label>
          <label class="popup-field">
            <span id="myInfoStateLabel" class="popup-label"></span>
            <input id="myInfoStateInput" name="state" type="text" maxlength="100" autocomplete="address-level1" />
          </label>
          <label class="popup-field">
            <span id="myInfoCountryLabel" class="popup-label"></span>
            <input id="myInfoCountryInput" name="country" type="text" maxlength="100" autocomplete="country-name" />
          </label>
          <label class="popup-field">
            <span id="myInfoGenderLabel" class="popup-label"></span>
            <select id="myInfoGender" class="my-info-gender-select">
              <option value="" id="myInfoGenderDefault" style="display:none"></option>
              <option value="Woman" id="myInfoGenderWoman"></option>
              <option value="Man" id="myInfoGenderMan"></option>
              <option value="Other" id="myInfoGenderOther"></option>
            </select>
          </label>
        </form>

        <div class="popup-actions">
          <button id="myInfoCancelBtn" class="popup-btn-cancel" type="button"></button>
          <button id="myInfoSaveBtn" class="popup-btn-save" type="button"></button>
        </div>
        <div id="myInfoStatus" class="popup-status" role="status" aria-live="polite"></div>

        <!-- USAGE MONITOR (hidden for anonymous users) -->
        <div id="usageMonitor" class="usage-monitor hidden" aria-hidden="true">
          <h3 id="usageMonitorTitle" class="usage-monitor-title"></h3>

          <div class="usage-monitor-row">
            <span id="usageVoiceLabel" class="usage-monitor-label"></span>
            <span id="usageVoicePct" class="usage-monitor-pct"></span>
          </div>
          <div class="usage-monitor-track">
            <div id="usageVoiceBar" class="usage-monitor-bar usage-monitor-bar--voice"></div>
          </div>

          <div class="usage-monitor-row">
            <span id="usageChatLabel" class="usage-monitor-label"></span>
            <span id="usageChatPct" class="usage-monitor-pct"></span>
          </div>
          <div class="usage-monitor-track">
            <div id="usageChatBar" class="usage-monitor-bar usage-monitor-bar--chat"></div>
          </div>

          <p class="usage-monitor-plan-line">
            <span id="usageCurrentPlanLabel"></span> <span id="usageCurrentPlanName" class="usage-monitor-plan-name"></span>
          </p>

          <div class="popup-actions">
            <button id="usageCloseBtn" class="popup-btn-cancel" type="button"></button>
            <button id="usageGetMoreTimeBtn" class="popup-btn-save" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- PLAN SELECTION OVERLAY -->
    <div id="planSelectionOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="plan-selection-card" role="dialog" aria-modal="true" aria-labelledby="planSelectionHeader">
        <div class="plan-selection-scroll">

          <div class="plan-promo-box">
            <h2 id="planPromoTitle" class="plan-promo-title"></h2>
            <p id="planPromoBody" class="plan-promo-body"></p>
          </div>

          <h1 id="planSelectionHeader" class="plan-selection-header"></h1>

          <div id="planCardsContainer" class="plan-cards-container"></div>

          <h1 id="otherPlansHeader" class="plan-selection-header"></h1>

          <div id="topUpCardContainer" class="plan-cards-container"></div>

          <div class="plan-notes">
            <p id="planNoteTerms" class="plan-notes-p"></p>
            <p id="planNoteGP" class="plan-notes-p"></p>
            <p id="planNoteChange" class="plan-notes-p"></p>
            <p id="planNoteBrendy" class="plan-notes-p"></p>
            <p id="planNoteRestrictions" class="plan-notes-p"></p>
            <p id="planNoteAccept" class="plan-notes-p"></p>
            <p class="plan-notes-p"><a id="planNotePrivacy" class="plan-notes-link" href="privacy.html" target="_blank" rel="noopener"></a></p>
          </div>

        </div>
      </div>
    </div>

    <!-- MEDICATION OVERLAY -->
    <div id="medOverlay" class="med-overlay hidden" aria-hidden="true">
      <div id="medCard" class="med-card" role="dialog" aria-modal="true">

        <!-- ── DISCLAIMER PANEL ── -->
        <div id="medDisclaimer" class="med-panel" style="display:none">
          <h2 id="medDisclaimerTitle" class="med-panel-title"></h2>
          <p  id="medDisclaimerText"  class="med-disclaimer-text"></p>
          <button id="medDisclaimerBtn" class="med-primary-btn" type="button"></button>
        </div>

        <!-- ── MAIN LIST PANEL ── -->
        <div id="medMain" class="med-panel" style="display:none">
          <div class="med-panel-header">
            <h2 id="medMainTitle" class="med-panel-title"></h2>
            <button id="medCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>
          <p id="medPersistentNote" class="med-persistent-note"></p>
          <div id="medNotifPrompt" class="med-notif-prompt" style="display:none">
            <span id="medNotifPromptText" class="med-notif-text"></span>
            <button id="medNotifBtn" class="med-notif-enable-btn" type="button"></button>
          </div>
          <div id="medList" class="med-list"></div>
          <div class="med-main-actions">
            <button id="medAddBtn"          class="med-primary-btn"   type="button"></button>
            <button id="medViewScheduleBtn" class="med-secondary-btn" type="button"></button>
          </div>
        </div>

        <!-- ── FORM PANEL ── -->
        <div id="medForm" class="med-panel med-form-panel" style="display:none">
          <div class="med-panel-header">
            <h2 id="medFormTitle" class="med-panel-title"></h2>
            <button id="medFormCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>

          <!-- Correct / Record-change toggle (only when editing) -->
          <div id="medToggleRow" class="med-toggle-row hidden">
            <span id="medToggleCorrectLbl" class="med-toggle-lbl"></span>
            <label class="med-toggle-switch">
              <input id="medToggle" type="checkbox" />
              <span class="med-toggle-slider"></span>
            </label>
            <span id="medToggleChangeLbl" class="med-toggle-lbl"></span>
          </div>

          <form id="medFormEl" class="med-form-fields" autocomplete="off" onsubmit="return false">

            <label class="med-field">
              <span id="medNameLabel" class="med-field-label"></span>
              <input id="medNameInput" class="med-input" type="text" maxlength="120" required />
            </label>

            <label class="med-field">
              <span id="medDoseLabel" class="med-field-label"></span>
              <input id="medDoseInput" class="med-input" type="text" maxlength="80" />
            </label>

            <div class="med-field">
              <span id="medFreqLabel" class="med-field-label"></span>
              <select id="medFreqSelect" class="med-select">
                <option value="daily"></option>
                <option value="weekly"></option>
                <option value="interval"></option>
              </select>
            </div>

            <!-- Weekly days (hidden unless weekly) -->
            <div id="medDaysRow" class="med-field hidden">
              <span id="medDaysLabel" class="med-field-label"></span>
              <div class="med-days-grid">
                <label class="med-day-check"><input id="medDayCb0" type="checkbox" value="sunday" />    <span id="medDaySunLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb1" type="checkbox" value="monday" />   <span id="medDayMonLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb2" type="checkbox" value="tuesday" />  <span id="medDayTueLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb3" type="checkbox" value="wednesday" /><span id="medDayWedLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb4" type="checkbox" value="thursday" /> <span id="medDayThuLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb5" type="checkbox" value="friday" />   <span id="medDayFriLbl"></span></label>
                <label class="med-day-check"><input id="medDayCb6" type="checkbox" value="saturday" /> <span id="medDaySatLbl"></span></label>
              </div>
            </div>

            <!-- Interval days (hidden unless interval) -->
            <div id="medIntervalRow" class="med-field hidden">
              <span id="medIntervalLabel" class="med-field-label"></span>
              <input id="medIntervalInput" class="med-input med-input-short" type="number" min="1" max="365" value="1" />
            </div>

            <!-- Directions -->
            <label class="med-field">
              <span id="medDirectionsLabel" class="med-field-label"></span>
              <input id="medDirectionsInput" class="med-input" type="text" maxlength="30" />
            </label>

            <!-- Times -->
            <div class="med-field">
              <span id="medTimesLabel" class="med-field-label">Med Times <span style="color:red">*</span></span>
              <div id="medTimesContainer" class="med-times-container">
                <div class="med-time-row"><input type="time" class="med-time-input" required></div>
              </div>
              <button id="medAddTimeBtn" class="med-link-btn" type="button">+ Añadir hora</button>
            </div>

            <label class="med-field">
              <span id="medStartLabel" class="med-field-label"></span>
              <input id="medStartInput" class="med-input med-input-date" type="date" />
            </label>

            <!-- Limited course checkbox -->
            <div class="med-field med-field-inline">
              <input id="medLimitedCheck" type="checkbox" class="med-checkbox" />
              <span id="medLimitedLabel" class="med-field-label"></span>
            </div>

            <!-- End date (hidden unless limited) -->
            <div id="medEndRow" class="med-field hidden">
              <span id="medEndLabel" class="med-field-label"></span>
              <input id="medEndInput" class="med-input med-input-date" type="date" />
            </div>

            <label class="med-field">
              <span id="medNotesLabel" class="med-field-label"></span>
              <textarea id="medNotesInput" class="med-input med-textarea" rows="2" maxlength="300"></textarea>
            </label>

            <label class="med-field">
              <span id="medEnteredByLabel" class="med-field-label"></span>
              <input id="medEnteredByInput" class="med-input" type="text" maxlength="80" />
            </label>

            <!-- Change reason (hidden unless toggle = "change") -->
            <div id="medChangeReasonRow" class="med-field hidden">
              <span id="medChangeReasonLabel" class="med-field-label"></span>
              <input id="medChangeReasonInput" class="med-input" type="text" maxlength="200" />
            </div>

            <label class="med-field">
              <span id="medTimezoneLabel" class="med-field-label"></span>
              <input id="medTimezoneInput" class="med-input" type="text" maxlength="60" />
            </label>

          </form>

          <div class="med-form-status" id="medFormStatus" role="status" aria-live="polite"></div>

          <div class="med-form-actions">
            <button id="medFormCancelBtn"   class="med-secondary-btn" type="button"></button>
            <button id="medFormScheduleBtn" class="med-link-btn"      type="button"></button>
            <button id="medFormSaveBtn"     class="med-primary-btn"   type="button"></button>
          </div>
        </div>

        <!-- ── SCHEDULE PANEL ── -->
        <div id="medSchedule" class="med-panel med-schedule-panel" style="display:none">
          <div class="med-panel-header">
            <h2 id="medScheduleTitle" class="med-panel-title"></h2>
            <button id="medScheduleCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>
          <div id="medScheduleContent" class="med-schedule-content"></div>
          <div class="med-form-actions">
            <button id="medScheduleBackBtn"  class="med-secondary-btn" type="button"></button>
            <button id="medSchedulePrintBtn" class="med-primary-btn"   type="button"></button>
          </div>
        </div>

      </div>
    </div>

    <!-- LATEST (MY NEWS CATEGORIES) OVERLAY -->
    <div id="latestOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="latestTitle">
        <div class="popup-card-header">
          <h1 id="latestTitle"></h1>
          <button id="latestCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="latestSubtitle" class="popup-subtitle"></h2>

        <div class="latest-categories">
          <label class="latest-cat-item">
            <input id="latestCatActualidad" type="checkbox" value="actualidad" />
            <span id="latestCatActualidadLabel"></span>
          </label>
          <label class="latest-cat-item">
