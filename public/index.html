<html lang="en">

  <!-- Fonts for Auth Overlay -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Nunito+Sans:wght@400&family=Open+Sans:wght@600&family=Roboto:wght@400&display=swap"

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KB9LWQDF"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="container">
    <!-- Fixed header inside container -->
    <div class="header">
      <div class="header-left">
        <img src="images/brenda-avatar.png" alt="Brenda" class="avatar" id="brendaAvatar" />
        <div class="header-title-block">
          <div class="header-top">
            <h1>IA Brenda</h1>
            <div class="header-top-buttons">
              <button id="accountBtn" class="account-btn" type="button"></button>
              <button id="myInfoBtn" class="my-info-btn" type="button"></button>
            </div>
            <button id="helpBtn" class="help-btn" type="button" aria-label="Help">?</button>
          </div>
        </div>
        <div class="header-actions">
          <button id="subjectsBtn" class="subjects-btn" type="button"></button>
          <button id="taskBtn" class="task-btn" type="button"></button>
          <button id="latestBtn" class="latest-btn" type="button"></button>
          <button id="headlinesBtn" class="headlines-btn" type="button"></button>
          <button id="chatBtn" class="chat-rds-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- Main content area -->
    <div class="main">

      <!-- MODE VISUAL AREA (top) -->
      <section class="mode-visual">

        <!-- TALK visual -->
        <div id="panelTalk" class="panel panel-talk">
          <div class="voice-visualizer">
            <canvas id="waveform"></canvas>
          </div>
        </div>

        <!-- TEXT visual (none for now) -->
        <div id="panelText" class="panel panel-text hidden"></div>

        <!-- VIDEO (future) -->
        <div id="panelVideo" class="panel panel-video hidden"></div>

      </section>

      <!-- SHARED TRANSCRIPT (never changes across modes) -->
      <section class="panel panel-transcript" aria-live="polite">
        <div id="transcript" class="transcript">
          <div class="transcript-inner" id="transcriptInner"></div>
        </div>
      </section>

      <!-- CALL OVERLAY (new) -->
      <div id="callConnecting" class="call-connecting hidden" aria-hidden="true">
        <div class="connecting-pill" role="status" aria-live="polite">
          <span class="connecting-label" id="callConnectingLabel">Connecting</span>
          <span class="connecting-dots" aria-hidden="true">
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
          </span>
        </div>
      </div>
      <div id="callThinking" class="call-connecting hidden" aria-hidden="true">
        <div class="connecting-pill" role="status" aria-live="polite">
          <span class="connecting-label" id="callThinkingLabel">Thinking</span>
          <span class="connecting-dots" aria-hidden="true">
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
            <span class="connecting-dot"></span>
          </span>
        </div>
      </div>

      <div id="callOverlay" class="call-overlay hidden" aria-hidden="true">
        <div class="call-card">
          <button id="callMinBtn" class="call-min-btn" type="button" aria-label="Minimise">
            <!-- square + hyphen -->
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M8 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>

          <div class="call-card-body">
            <img class="call-avatar" src="images/brenda-avatar.png" alt="Brenda" />
            <div class="call-title" id="callTitle"></div>
          </div>

          <button id="callHangBtn" class="call-hang-btn" type="button" aria-label="Hang up">
            <div class="call-hang-progress" aria-hidden="true"></div>
            <img src="images/hangup-icon-100x100.png" alt="" class="call-hang-icon" draggable="false" />
          </button>

          <p id="callDisclaimer" class="ai-disclaimer call-disclaimer"></p>

        </div>
      </div>

      <!-- MINIMISED CALL TILE (new) -->
      <div id="callTile" class="call-tile hidden" aria-hidden="true">
        <button id="callExpandBtn" class="call-expand-btn" type="button" aria-label="Expand">
          <!-- hyphen icon (square + short line) -->
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- MODE INPUT AREA (bottom of main; switches by mode) -->
      <section class="mode-input">

        <p id="aiDisclaimer" class="ai-disclaimer"></p>

        <!-- TEXT input -->
        <div id="textInputWrap" class="text-input-wrap hidden">
          <div class="chat-inputbar">
            <textarea id="chatInput" class="chat-input" rows="1" placeholder="Type a message..."></textarea>
            <button id="chatSendBtn" class="chat-send" type="button">Send</button>
          </div>
        </div>

      </section>

    </div>

    <!-- Bottom controls (Talk/Text buttons) -->
    <div class="activate-buttons-frame">
      <div class="row">

        <!--  <button id="toggleBtnTalk" class="btn-toggle-talk btn-connect-talk" type="button"></button> -->
        <!--  <button id="toggleBtnText" class="btn-toggle-text btn-connect-text" type="button"></button> -->
        <button id="toggleBtnTalk" class="btn-toggle-talk btn-connect-talk" type="button">Talk</button>
        <button id="toggleBtnText" class="btn-toggle-text btn-connect-text" type="button">Text</button>

      </div>

      <div class="row">
        <div class="column">
          <p class="hintTalk" id="hintTalk">Click to Speak</p>
        </div>
        <div class="column">
          <p class="hintText" id="hintText">Click to Text</p>
        </div>
      </div>
    </div>

    <!-- AUTH OVERLAY (Sign in / Sign up) -->
    <div id="authOverlay" class="auth-overlay hidden" aria-hidden="true">
      <div class="auth-card">
        <button id="authCloseBtn" class="popup-close-btn auth-close hidden" type="button" aria-label="Close">×</button>

        <div class="auth-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="auth-avatar" />
          <div class="auth-greeting" id="authGreeting"></div>
          <div class="auth-explain" id="authExplain"></div>
        </div>

        <div class="auth-form">
          <label class="auth-label" for="authNick" id="authNickLabel"></label>
          <input id="authNick" class="auth-input" type="text" inputmode="text" autocomplete="username" />
          <div class="auth-help" id="authNickHelp"></div>

          <label class="auth-label" for="authPin" id="authPinLabel"></label>
          <input id="authPin" class="auth-input" type="password" inputmode="numeric" autocomplete="current-password"
            maxlength="4" />
          <div class="auth-help" id="authPinHelp01"></div>
          <div class="auth-help" id="authPinHelp02"></div>

          <button id="authContinueBtn" class="auth-continue" type="button"></button>

          <div class="auth-error" id="authError" role="alert" aria-live="polite"></div>

          <button id="authAnonBtn" class="auth-anon-link" type="button"></button>

          <a class="auth-privacy" id="authPrivacyLink" href="privacy.html" target="_blank" rel="noopener"></a>

          <!-- Only shown when logged in as a named account (auth overlay reopened via the Account button) -->
          <button id="deleteAccountLinkBtn" class="delete-account-link hidden" type="button"></button>
        </div>
      </div>
    </div>

    <!-- CONSENT OVERLAY (AI disclosure, shown once after account creation/login until accepted) -->
    <div id="consentOverlay" class="brenda-overlay consent-overlay hidden" aria-hidden="true">
      <div class="brenda-card consent-card" role="dialog" aria-modal="true">
        <div class="brenda-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="brenda-avatar" />
          <h1 id="consentTitle" class="brenda-title"></h1>
          <h2 id="consentSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div id="consentContent" class="brenda-content"></div>

        <div class="consent-error" id="consentError" role="alert" aria-live="polite"></div>

        <div class="consent-actions">
          <button id="consentDeclineBtn" class="consent-decline-btn" type="button"></button>
          <button id="consentAgreeBtn" class="consent-agree-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- TALK DISCLAIMER OVERLAY (shown once, first time TALK is tapped on an account) -->
    <div id="talkOverlay" class="brenda-overlay talk-overlay hidden" aria-hidden="true">
      <div class="brenda-card consent-card" role="dialog" aria-modal="true">
        <div class="brenda-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="brenda-avatar" />
          <h1 id="talkTitle" class="brenda-title"></h1>
          <h2 id="talkSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div id="talkContent" class="brenda-content"></div>

        <div class="consent-error" id="talkError" role="alert" aria-live="polite"></div>

        <div class="consent-actions">
          <button id="talkGotItBtn" class="talk-gotit-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- PRIVACY POLICY OVERLAY (on-demand, viewable anytime, not gated) -->
    <div id="privacyOverlay" class="brenda-overlay privacy-overlay hidden" aria-hidden="true">
      <div class="brenda-card consent-card privacy-card" role="dialog" aria-modal="true">
        <button id="privacyCloseBtn" class="popup-close-btn privacy-close-btn" type="button" aria-label="Close">×</button>

        <div class="brenda-top">
          <h1 id="privacyTitle" class="brenda-title"></h1>
        </div>

        <div id="privacyContent" class="brenda-content"></div>

        <div class="privacy-actions">
          <button id="privacyUnderstoodBtn" class="privacy-understood-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- ACCOUNT DELETION OVERLAY (from the Account/auth overlay, named accounts only) -->
    <div id="deleteAccountOverlay" class="brenda-overlay privacy-overlay hidden" aria-hidden="true">
      <div class="brenda-card consent-card" role="dialog" aria-modal="true">
        <button id="deleteAccountCloseBtn" class="popup-close-btn privacy-close-btn" type="button" aria-label="Close">×</button>

        <div class="brenda-top">
          <h1 id="deleteAccountTitle" class="brenda-title"></h1>
          <h2 id="deleteAccountSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div id="deleteAccountContent" class="brenda-content"></div>

        <div class="consent-error" id="deleteAccountError" role="alert" aria-live="polite"></div>

        <div class="privacy-actions">
          <button id="deleteAccountConfirmBtn" class="delete-account-confirm-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- ACCOUNT DELETION — FINAL CONFIRMATION (re-enter Nick + PIN) -->
    <div id="deleteAccountFinalOverlay" class="brenda-overlay privacy-overlay hidden" aria-hidden="true">
      <div class="brenda-card consent-card" role="dialog" aria-modal="true">
        <button id="deleteAccountFinalCloseBtn" class="popup-close-btn privacy-close-btn" type="button" aria-label="Close">×</button>

        <div class="brenda-top">
          <h1 id="deleteAccountFinalTitle" class="brenda-title"></h1>
          <h2 id="deleteAccountFinalSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div class="auth-form">
          <label class="auth-label" id="deleteAccountFinalNickLabel" for="deleteAccountFinalNick"></label>
          <input id="deleteAccountFinalNick" class="auth-input" type="text" inputmode="text" autocomplete="username" />

          <label class="auth-label" id="deleteAccountFinalPinLabel" for="deleteAccountFinalPin"></label>
          <input id="deleteAccountFinalPin" class="auth-input" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" />
        </div>

        <div class="consent-error" id="deleteAccountFinalError" role="alert" aria-live="polite"></div>

        <div class="privacy-actions">
          <button id="deleteAccountFinalBtn" class="delete-account-confirm-btn" type="button"></button>
        </div>
      </div>
    </div>

    <!-- SUBJECTS POPUP -->
    <div id="subjectsOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="subjectsTitle">
        <div class="popup-card-header">
          <h1 id="subjectsTitle"></h1>
          <button id="subjectsCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="subjectsSubtitle" class="popup-subtitle"></h2>

        <form id="subjectsForm" class="popup-form">
          <label class="popup-field">
            <span id="subjectLabel1" class="popup-label"></span>
            <input id="subjectInput1" name="subject1" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel2" class="popup-label"></span>
            <input id="subjectInput2" name="subject2" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel3" class="popup-label"></span>
            <input id="subjectInput3" name="subject3" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel4" class="popup-label"></span>
            <input id="subjectInput4" name="subject4" type="text" maxlength="120" />
          </label>
          <label class="popup-field">
            <span id="subjectLabel5" class="popup-label"></span>
            <input id="subjectInput5" name="subject5" type="text" maxlength="120" />
          </label>
        </form>

        <div class="popup-actions">
          <button id="subjectsCancelBtn" class="popup-btn-cancel" type="button"></button>
          <button id="subjectsSaveBtn" class="popup-btn-save" type="button"></button>
        </div>
        <div id="subjectsStatus" class="popup-status" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- HELP OVERLAY -->
    <div id="helpOverlay" class="help-overlay hidden" aria-hidden="true">
      <div class="help-card" role="dialog" aria-modal="true">
        <button id="helpCloseBtn" class="help-close-btn" type="button" aria-label="Close">×</button>
        <div id="helpContent" class="help-content" role="document"></div>
        <button id="helpBottomCloseBtn" class="help-bottom-close" type="button"></button>
      </div>
    </div>

    <!-- I AM BRENDA OVERLAY -->
    <div id="brendaOverlay" class="brenda-overlay hidden" aria-hidden="true">
      <div class="brenda-card" role="dialog" aria-modal="true">
        <button id="brendaCloseBtn" class="brenda-close-btn" type="button" aria-label="Close">×</button>
        
        <div class="brenda-top">
          <img src="images/brenda-avatar.png" alt="Brenda" class="brenda-avatar" />
          <h1 id="brendaTitle" class="brenda-title"></h1>
          <h2 id="brendaSubtitle" class="brenda-subtitle"></h2>
        </div>

        <div id="brendaContent" class="brenda-content"></div>
        
        <button id="brendaBottomCloseBtn" class="brenda-bottom-close" type="button"></button>
      </div>
    </div>

    <!-- MY INFO OVERLAY -->
    <div id="myInfoOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="myInfoTitle">
        <div class="popup-card-header">
          <h1 id="myInfoTitle"></h1>
          <button id="myInfoCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="myInfoSubtitle" class="popup-subtitle"></h2>

        <form id="myInfoForm" class="popup-form">
          <label class="popup-field">
            <span id="myInfoTownLabel" class="popup-label"></span>
            <input id="myInfoTownInput" name="town" type="text" maxlength="100" autocomplete="address-level2" />
          </label>
          <label class="popup-field">
            <span id="myInfoStateLabel" class="popup-label"></span>
            <input id="myInfoStateInput" name="state" type="text" maxlength="100" autocomplete="address-level1" />
          </label>
          <label class="popup-field">
            <span id="myInfoCountryLabel" class="popup-label"></span>
            <input id="myInfoCountryInput" name="country" type="text" maxlength="100" autocomplete="country-name" />
          </label>
          <label class="popup-field">
            <span id="myInfoGenderLabel" class="popup-label"></span>
            <select id="myInfoGender" class="my-info-gender-select">
              <option value="" id="myInfoGenderDefault" style="display:none"></option>
              <option value="Woman" id="myInfoGenderWoman"></option>
              <option value="Man" id="myInfoGenderMan"></option>
              <option value="Other" id="myInfoGenderOther"></option>
            </select>
          </label>
        </form>

        <div class="popup-actions">
          <button id="myInfoCancelBtn" class="popup-btn-cancel" type="button"></button>
          <button id="myInfoSaveBtn" class="popup-btn-save" type="button"></button>
        </div>
        <div id="myInfoStatus" class="popup-status" role="status" aria-live="polite"></div>

        <!-- USAGE MONITOR (hidden for anonymous users) -->
        <div id="usageMonitor" class="usage-monitor hidden" aria-hidden="true">
          <h3 id="usageMonitorTitle" class="usage-monitor-title"></h3>

          <div class="usage-monitor-row">
            <span id="usageVoiceLabel" class="usage-monitor-label"></span>
            <span id="usageVoicePct" class="usage-monitor-pct"></span>
          </div>
          <div class="usage-monitor-track">
            <div id="usageVoiceBar" class="usage-monitor-bar usage-monitor-bar--voice"></div>
          </div>

          <div class="usage-monitor-row">
            <span id="usageChatLabel" class="usage-monitor-label"></span>
            <span id="usageChatPct" class="usage-monitor-pct"></span>
          </div>
          <div class="usage-monitor-track">
            <div id="usageChatBar" class="usage-monitor-bar usage-monitor-bar--chat"></div>
          </div>

          <p class="usage-monitor-plan-line">
            <span id="usageCurrentPlanLabel"></span> <span id="usageCurrentPlanName" class="usage-monitor-plan-name"></span>
          </p>

          <div class="popup-actions">
            <button id="usageCloseBtn" class="popup-btn-cancel" type="button"></button>
            <button id="usageGetMoreTimeBtn" class="popup-btn-save" type="button"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- PLAN SELECTION OVERLAY -->
    <div id="planSelectionOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="plan-selection-card" role="dialog" aria-modal="true" aria-labelledby="planSelectionHeader">
        <div class="plan-selection-scroll">

          <div class="plan-promo-box">
            <h2 id="planPromoTitle" class="plan-promo-title"></h2>
            <p id="planPromoBody" class="plan-promo-body"></p>
          </div>

          <div id="topUpCardContainer" class="plan-cards-container"></div>

          <h1 id="planSelectionHeader" class="plan-selection-header"></h1>

          <div id="planCardsContainer" class="plan-cards-container"></div>

          <div class="plan-notes">
            <p id="planNoteTerms" class="plan-notes-p"></p>
            <p id="planNoteGP" class="plan-notes-p"></p>
            <p id="planNoteChange" class="plan-notes-p"></p>
            <p id="planNoteBrendy" class="plan-notes-p"></p>
            <p id="planNoteRestrictions" class="plan-notes-p"></p>
            <p id="planNoteAccept" class="plan-notes-p"></p>
            <p class="plan-notes-p"><a id="planNotePrivacy" class="plan-notes-link" href="privacy.html" target="_blank" rel="noopener"></a></p>
          </div>

        </div>
      </div>
    </div>

    <!-- TASK OVERLAY -->
    <div id="taskOverlay" class="task-overlay hidden" aria-hidden="true">
      <div id="taskCard" class="task-card" role="dialog" aria-modal="true">

        <!-- ── DISCLAIMER PANEL ── -->
        <div id="taskDisclaimer" class="task-panel" style="display:none">
          <h2 id="taskDisclaimerTitle" class="task-panel-title"></h2>
          <p  id="taskDisclaimerText"  class="task-disclaimer-text"></p>
          <button id="taskDisclaimerBtn" class="task-primary-btn" type="button"></button>
        </div>

        <!-- ── MAIN LIST PANEL ── -->
        <div id="taskMain" class="task-panel" style="display:none">
          <div class="task-panel-header">
            <h2 id="taskMainTitle" class="task-panel-title"></h2>
            <button id="taskCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>
          <p id="taskPersistentNote" class="task-persistent-note"></p>
          <div id="taskNotifPrompt" class="task-notif-prompt"         style="display:none">
            <span id="taskNotifPromptText" class="task-notif-text"></span>
            <button id="taskNotifBtn" class="task-notif-enable-btn" type="button"></button>
          </div>
          <div id="taskList" class="task-list"></div>
          <div class="task-main-actions">
            <button id="taskAddBtn"          class="task-primary-btn"   type="button"></button>
            <button id="taskViewScheduleBtn" class="task-secondary-btn" type="button"></button>
          </div>
        </div>

        <!-- ── FORM PANEL ── -->
        <div id="taskForm" class="task-panel task-form-panel" style="display:none">
          <div class="task-panel-header">
            <h2 id="taskFormTitle" class="task-panel-title"></h2>
            <button id="taskFormCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>

          <!-- Correct / Record-change toggle (only when editing) -->
          <div id="taskToggleRow" class="task-toggle-row hidden">
            <span id="taskToggleCorrectLbl" class="task-toggle-lbl"></span>
            <label class="task-toggle-switch">
              <input id="taskToggle" type="checkbox" />
              <span class="task-toggle-slider"></span>
            </label>
            <span id="taskToggleChangeLbl" class="task-toggle-lbl"></span>
          </div>

          <form id="taskFormEl" class="task-form-fields" autocomplete="off" onsubmit="return false">

            <label class="task-field">
              <span id="taskNameLabel" class="task-field-label"></span>
              <input id="taskNameInput" class="task-input" type="text" maxlength="120" required />
            </label>

            <label class="task-field">
              <span id="taskQuantityLabel" class="task-field-label"></span>
              <input id="taskQuantityInput" class="task-input" type="text" maxlength="80" />
            </label>

            <div class="task-field">
              <span id="taskFreqLabel" class="task-field-label"></span>
              <select id="taskFreqSelect" class="task-select">
                <option value="daily"></option>
                <option value="weekly"></option>
                <option value="interval"></option>
              </select>
            </div>

            <!-- Weekly days (hidden unless weekly) -->
            <div id="taskDaysRow" class="task-field hidden">
              <span id="taskDaysLabel" class="task-field-label"></span>
              <div class="task-days-grid">
                <label class="task-day-check"><input id="taskDayCb0" type="checkbox" value="sunday" />    <span id="taskDaySunLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb1" type="checkbox" value="monday" />   <span id="taskDayMonLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb2" type="checkbox" value="tuesday" />  <span id="taskDayTueLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb3" type="checkbox" value="wednesday" /><span id="taskDayWedLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb4" type="checkbox" value="thursday" /> <span id="taskDayThuLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb5" type="checkbox" value="friday" />   <span id="taskDayFriLbl"></span></label>
                <label class="task-day-check"><input id="taskDayCb6" type="checkbox" value="saturday" /> <span id="taskDaySatLbl"></span></label>
              </div>
            </div>

            <!-- Interval days (hidden unless interval) -->
            <div id="taskIntervalRow" class="task-field hidden">
              <span id="taskIntervalLabel" class="task-field-label"></span>
              <input id="taskIntervalInput" class="task-input task-input-short" type="number" min="1" max="365" value="1" />
            </div>

            <!-- Directions -->
            <label class="task-field">
              <span id="taskDirectionsLabel" class="task-field-label"></span>
              <input id="taskDirectionsInput" class="task-input" type="text" maxlength="30" />
            </label>

            <!-- Times -->
            <div class="task-field">
              <span id="taskTimesLabel" class="task-field-label">Med Times <span style="color:red">*</span></span>
              <div id="taskTimesContainer" class="task-times-container">
                <div class="task-time-row"><input type="time" class="task-time-input" required></div>
              </div>
              <button id="taskAddTimeBtn" class="task-link-btn" type="button">+ Añadir hora</button>
            </div>

            <label class="task-field">
              <span id="taskStartLabel" class="task-field-label"></span>
              <input id="taskStartInput" class="task-input task-input-date" type="date" />
            </label>

            <!-- Limited course checkbox -->
            <div class="task-field task-field-inline">
              <input id="taskLimitedCheck" type="checkbox" class="task-checkbox" />
              <span id="taskLimitedLabel" class="task-field-label"></span>
            </div>

            <!-- End date (hidden unless limited) -->
            <div id="taskEndRow" class="task-field hidden">
              <span id="taskEndLabel" class="task-field-label"></span>
              <input id="taskEndInput" class="task-input task-input-date" type="date" />
            </div>

            <label class="task-field">
              <span id="taskNotesLabel" class="task-field-label"></span>
              <textarea id="taskNotesInput" class="task-input task-textarea" rows="2" maxlength="300"></textarea>
            </label>

            <label class="task-field">
              <span id="taskEnteredByLabel" class="task-field-label"></span>
              <input id="taskEnteredByInput" class="task-input" type="text" maxlength="80" />
            </label>

            <!-- Change reason (hidden unless toggle = "change") -->
            <div id="taskChangeReasonRow" class="task-field hidden">
              <span id="taskChangeReasonLabel" class="task-field-label"></span>
              <input id="taskChangeReasonInput" class="task-input" type="text" maxlength="200" />
            </div>

            <label class="task-field">
              <span id="taskTimezoneLabel" class="task-field-label"></span>
              <input id="taskTimezoneInput" class="task-input" type="text" maxlength="60" />
            </label>

          </form>

          <div class="task-form-status" id="taskFormStatus" role="status" aria-live="polite"></div>

          <div class="task-form-actions">
            <button id="taskFormCancelBtn"   class="task-secondary-btn" type="button"></button>
            <button id="taskFormScheduleBtn" class="task-link-btn"      type="button"></button>
            <button id="taskFormSaveBtn"     class="task-primary-btn"   type="button"></button>
          </div>
        </div>

        <!-- ── SCHEDULE PANEL ── -->
        <div id="taskSchedule" class="task-panel task-schedule-panel" style="display:none">
          <div class="task-panel-header">
            <h2 id="taskScheduleTitle" class="task-panel-title"></h2>
            <button id="taskScheduleCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
          </div>
          <div id="taskScheduleContent" class="task-schedule-content"></div>
          <div class="task-form-actions">
            <button id="taskScheduleBackBtn"  class="task-secondary-btn" type="button"></button>
            <button id="taskSchedulePrintBtn" class="task-primary-btn"   type="button"></button>
          </div>
        </div>

      </div>
    </div>

    <!-- LATEST (MY NEWS CATEGORIES) OVERLAY -->
    <div id="latestOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="latestTitle">
        <div class="popup-card-header">
          <h1 id="latestTitle"></h1>
          <button id="latestCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>
        <h2 id="latestSubtitle" class="popup-subtitle"></h2>

        <div class="latest-categories">
          <label class="latest-cat-item">
            <input id="latestCatActualidad" type="checkbox" value="actualidad" />
            <span id="latestCatActualidadLabel"></span>
          </label>
          <label class="latest-cat-item">
            <input id="latestCatGossip" type="checkbox" value="gossip" />
            <span id="latestCatGossipLabel"></span>
          </label>
          <label class="latest-cat-item">
            <input id="latestCatSport" type="checkbox" value="sport" />
            <span id="latestCatSportLabel"></span>
          </label>
          <label class="latest-cat-item">
            <input id="latestCatPolitica" type="checkbox" value="politica" />
            <span id="latestCatPoliticaLabel"></span>
          </label>
          <label class="latest-cat-item">
            <input id="latestCatTv" type="checkbox" value="tv" />
            <span id="latestCatTvLabel"></span>
          </label>
        </div>

        <div class="popup-actions">
          <button id="latestCancelBtn" class="popup-btn-cancel" type="button"></button>
          <button id="latestSaveBtn" class="popup-btn-save" type="button"></button>
        </div>
        <div id="latestStatus" class="popup-status" role="status" aria-live="polite"></div>
      </div>
    </div>

    <!-- HEADLINES OVERLAY -->
    <div id="headlinesOverlay" class="popup-overlay hidden" aria-hidden="true">
      <div class="headlines-card" role="dialog" aria-modal="true" aria-labelledby="headlinesTitle">

        <!-- Header -->
        <div class="popup-card-header">
          <h1 id="headlinesTitle"></h1>
          <button id="headlinesCloseBtn" class="popup-close-btn" type="button" aria-label="Close">×</button>
        </div>

        <!-- Heat tier legend -->
        <div class="headlines-legend">
          <span class="heat-legend-item">
            <span class="heat-dot heat-dot-hot"></span>
            <span id="legendHot"></span>
          </span>
          <span class="heat-legend-item">
            <span class="heat-dot heat-dot-warm"></span>
            <span id="legendWarm"></span>
          </span>
          <span class="heat-legend-item">
            <span class="heat-dot heat-dot-cool"></span>
            <span id="legendCool"></span>
          </span>
        </div>

        <!-- Signal key -->
        <div class="headlines-signal-legend" id="headlinesSignalLegend"></div>

        <!-- Loading state (shown while fetching) -->
        <div id="headlinesLoading" class="headlines-loading hidden" aria-live="polite">
          <div class="headlines-loading-dots">
            <span></span><span></span><span></span>
          </div>
          <p id="headlinesLoadingText" class="headlines-loading-text"></p>
        </div>

        <!-- Scrollable card list -->
        <div id="headlinesList" class="headlines-list"></div>

        <!-- Pinned refresh button -->
        <button id="headlinesRefreshBtn" class="headlines-refresh-btn" type="button"></button>

      </div>
    </div>

  </div>

  <!-- SIDENAV WRAPPER — clips panels to app container bounds -->
  <div id="sideNavWrapper" class="sidenav-wrapper">

    <!-- SIDENAV HOME -->
    <div id="sideNavHome" class="sidenav-panel sidenav-home" aria-hidden="true">
      <div class="sidenav-inner"></div>

    <div id="sideNavTomas" class="sidenav-panel sidenav-detail" aria-hidden="true">

    <div id="sideNavLatest" class="sidenav-panel sidenav-detail" aria-hidden="true">

    </div>

  </div>
